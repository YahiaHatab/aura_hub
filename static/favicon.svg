<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0b0d14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>
    
    <!-- Neon Vinyl Center Gradient -->
    <linearGradient id="neonCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Waveform Glow -->
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    
    <!-- Vinyl Grooves Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Outer Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Concentric Vinyl Grooves -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2e344e" stroke-width="0.8" stroke-dasharray="6,2" opacity="0.7"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1f2438" stroke-width="0.8" stroke-dasharray="8,3" opacity="0.8"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#2e344e" stroke-width="0.7" opacity="0.6"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#3b4263" stroke-width="0.7" stroke-dasharray="5,2" opacity="0.5"/>

  <!-- Center Label Disc -->
  <circle cx="32" cy="32" r="11" fill="url(#neonCenter)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="9" fill="#0b0d14"/>
  
  <!-- Stylized Audio Waveform across Center -->
  <path d="M 23 32 L 25 32 L 27 28 L 29 36 L 31 24 L 33 40 L 35 27 L 37 34 L 39 30 L 41 32" 
        fill="none" stroke="url(#waveGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Spindle Hole -->
  <circle cx="32" cy="32" r="2.5" fill="#f8fafc"/>
  <circle cx="32" cy="32" r="1.2" fill="#07080b"/>
</svg>
