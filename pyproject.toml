[project]
name = "aura-hub"
version = "0.1.0"
description = "Aura Hub Telegram bot and Navidrome metadata studio"
dependencies = [
    "fastapi>=0.103.0,<0.104.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0,<0.28.0",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    "python-telegram-bot>=20.7",
    "lyricsgenius>=3.0.1",
    "pyacoustid>=1.3.0",
    "spotdl>=4.2.4",
    "yt-dlp>=2024.03.10",
]

[tool.vercel]
entrypoint = "services.web:app"
